schema-version = 1

[package]
title = "Goodnight TV"
version = "0.1.0"
id = "com.goodnighttv.app"
icon = "@image/app_icon.png"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.audio_lib_2@IAudioLib_0"

[[needs.module]]
id = "/com.amazon.kepler.linear_gradient_2@ILinearGradient_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"




[components]
[[components.interactive]]
id = "com.goodnighttv.app.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[wants]
# Raw PCM playback (AudioPlaybackStream). Without these the stream fails silently (see friction-log.md #1).
[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

# Remote key events (useTVEventHandler), logged to measure which name OK arrives as.
[[wants.service]]
id = "com.amazon.inputd.service"

# The TV talks to the Goodnight TV server on the local network over plain ws://.
[network-traffic-policy.cleartext]
allowed-domains = ["*"]
